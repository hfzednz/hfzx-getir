name: nexora_customer
description: NEXORA Customer Mobile App — enterprise quick commerce client.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  nexora_core:
    path: ../../packages/flutter/nexora_core
  nexora_design:
    path: ../../packages/flutter/nexora_design

  app_links: ^6.4.1
  cached_network_image: ^3.4.1
  collection: ^1.19.1
  connectivity_plus: ^6.1.5
  device_info_plus: ^11.5.0
  dio: ^5.11.0
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  equatable: ^2.0.7
  firebase_analytics: ^11.6.0
  firebase_core: ^3.15.2
  firebase_crashlytics: ^4.3.10
  firebase_messaging: ^15.2.10
  flutter_animate: ^4.5.2
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.3.0
  freezed_annotation: ^2.4.4
  geolocator: ^13.0.4
  go_router: ^14.8.1
  google_maps_flutter: ^2.18.0
  google_sign_in: ^6.3.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  image_picker: ^1.2.0
  intl: any
  json_annotation: ^4.9.0
  local_auth: ^2.3.0
  mobile_scanner: ^6.0.11
  package_info_plus: ^8.3.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^11.4.0
  riverpod_annotation: ^2.6.1
  share_plus: ^10.1.4
  shimmer: ^3.0.0
  sign_in_with_apple: ^6.1.4
  speech_to_text: ^7.4.0
  sqlite3_flutter_libs: ^0.5.42
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.5.4
  drift_dev: ^2.28.0
  flutter_lints: ^6.0.0
  freezed: ^2.5.8
  golden_toolkit: ^0.15.0
  json_serializable: ^6.9.5
  mocktail: ^1.0.5
  riverpod_generator: ^2.6.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env.example
    - assets/images/
    - assets/icons/
    - assets/illustrations/
  # Brand fonts (Satoshi / Geist / Geist Mono): drop licensed files under
  # assets/fonts/ and register families here. Until then, design tokens use
  # system fallbacks defined in nexora_design.
