name: nexora_warehouse
description: NEXORA Warehouse (Dark Store) ops client.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  nexora_core:
    path: ../../packages/flutter/nexora_core
  nexora_design:
    path: ../../packages/flutter/nexora_design

  cached_network_image: ^3.4.1
  collection: ^1.19.1
  connectivity_plus: ^6.1.5
  device_info_plus: ^11.5.0
  dio: ^5.11.0
  equatable: ^2.0.7
  firebase_analytics: ^11.6.0
  firebase_core: ^3.15.2
  firebase_crashlytics: ^4.3.10
  firebase_messaging: ^15.2.10
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  image_picker: ^1.2.0
  intl: any
  local_auth: ^2.3.0
  mobile_scanner: ^6.0.11
  package_info_plus: ^8.3.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^11.4.0
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env.example
    - assets/images/
    - assets/icons/
