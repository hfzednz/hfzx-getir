openapi: 3.0.3
info:
  title: NEXORA Autonomy / Final Genesis
  version: 1.0.0
servers:
  - url: http://localhost:8125
paths:
  /health:
    get:
      responses: { "200": { description: ok } }
  /v1/autonomy/bootstrap:
    post:
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses: { "200": { description: bootstrapped } }
  /v1/autonomy/gates:
    get:
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses: { "200": { description: gates } }
  /v1/autonomy/genesis:
    post:
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses: { "201": { description: issued } }
  /v1/autonomy/admin/stats:
    get:
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses: { "200": { description: stats } }
