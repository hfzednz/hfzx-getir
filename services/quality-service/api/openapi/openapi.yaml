openapi: 3.0.3
info:
  title: NEXORA Quality Engineering Service
  version: 1.0.0
servers:
  - url: http://localhost:8118
paths:
  /health:
    get:
      responses: { "200": { description: ok } }
  /v1/quality/bootstrap:
    post:
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses: { "200": { description: suites+policies seeded } }
  /v1/quality/runs:
    post:
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses: { "201": { description: run started } }
  /v1/quality/certifications:
    post:
      summary: Issue release certification after gates pass
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: issued }
        "422": { description: quality gate failed }
  /v1/quality/admin/stats:
    get:
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses: { "200": { description: stats } }
