openapi: 3.0.3
info:
  title: NEXORA Hyperscale Certification
  version: 1.0.0
servers:
  - url: http://localhost:8124
paths:
  /health:
    get:
      responses: { "200": { description: ok } }
  /v1/hyperscale/bootstrap:
    post:
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses: { "200": { description: bootstrapped } }
  /v1/hyperscale/gates:
    get:
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses: { "200": { description: gates } }
  /v1/hyperscale/certificates:
    post:
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses: { "201": { description: issued } }
  /v1/hyperscale/admin/stats:
    get:
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses: { "200": { description: stats } }
