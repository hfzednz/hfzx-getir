syntax = "proto3";
package nexora.search.v1;
option go_package = "github.com/nexora/search-service/api/proto/search/v1;searchv1";

service SearchService {
  rpc Search (SearchRequest) returns (SearchResponse);
  rpc Autocomplete (AutocompleteRequest) returns (AutocompleteResponse);
}

message SearchRequest {
  string tenant_id = 1;
  string query = 2;
  bool hybrid = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message SearchHit {
  string product_id = 1;
  double score = 2;
}

message SearchResponse {
  string query_id = 1;
  repeated SearchHit hits = 2;
  int32 total = 3;
}

message AutocompleteRequest {
  string tenant_id = 1;
  string prefix = 2;
  int32 limit = 3;
}

message AutocompleteResponse {
  repeated string suggestions = 1;
}
