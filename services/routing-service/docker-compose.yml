services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
      POSTGRES_DB: routing
    ports:
      - "5448:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d routing"]
      interval: 5s
      timeout: 3s
      retries: 5

  routing-service:
    build: .
    ports:
      - "8097:8097"
    environment:
      HTTP_ADDR: ":8097"
      GRPC_ADDR: ":9107"
      CORS_ALLOWED_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
