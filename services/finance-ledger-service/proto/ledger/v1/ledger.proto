syntax = "proto3";

package nexora.ledger.v1;

option go_package = "github.com/nexora/finance-ledger-service/proto/ledger/v1;ledgerv1";

// LedgerService is the gRPC surface (HTTP is primary in v1).
service LedgerService {
  rpc EnsureAccount(EnsureAccountRequest) returns (Account);
  rpc PostJournal(PostJournalRequest) returns (Journal);
  rpc GetBalance(GetBalanceRequest) returns (Balance);
  rpc CreateInvoice(CreateInvoiceRequest) returns (Invoice);
  rpc TaxCalculate(TaxCalculateRequest) returns (TaxResult);
}

message Money {
  int64 amount_minor = 1;
  string currency = 2;
}

message Account {
  string id = 1;
  string code = 2;
  string name = 3;
  string type = 4;
  string currency = 5;
  bool active = 6;
}

message EnsureAccountRequest {
  string tenant_id = 1;
  string code = 2;
  string name = 3;
  string type = 4;
  string currency = 5;
}

message JournalLine {
  string account_id = 1;
  string account_code = 2;
  int64 debit_minor = 3;
  int64 credit_minor = 4;
  string memo = 5;
}

message Journal {
  string id = 1;
  string status = 2;
  string currency = 3;
  string reference = 4;
  repeated JournalLine lines = 5;
  int64 debit_total = 6;
  int64 credit_total = 7;
}

message PostJournalRequest {
  string tenant_id = 1;
  string currency = 2;
  string reference = 3;
  string idempotency_key = 4;
  repeated JournalLine lines = 5;
}

message GetBalanceRequest {
  string tenant_id = 1;
  string account_id = 2;
}

message Balance {
  string account_id = 1;
  string currency = 2;
  int64 balance_minor = 3;
}

message InvoiceLine {
  string description = 1;
  int64 qty = 2;
  int64 unit_minor = 3;
  string tax_code = 4;
}

message Invoice {
  string id = 1;
  string status = 2;
  string currency = 3;
  int64 subtotal_minor = 4;
  int64 tax_minor = 5;
  int64 total_minor = 6;
}

message CreateInvoiceRequest {
  string tenant_id = 1;
  string currency = 2;
  string counterparty_ref = 3;
  bool issue = 4;
  string default_tax_code = 5;
  repeated InvoiceLine lines = 6;
}

message TaxCalculateRequest {
  string tenant_id = 1;
  int64 base_minor = 2;
  string currency = 3;
  string tax_code = 4;
}

message TaxResult {
  int64 base_minor = 1;
  int64 tax_minor = 2;
  int64 total_minor = 3;
  int64 rate_bps = 4;
  string tax_code = 5;
  string currency = 6;
}
