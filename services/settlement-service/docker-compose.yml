services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
      POSTGRES_DB: settlement
    ports:
      - "5441:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d settlement"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6388:6379"

  settlement-service:
    build: .
    ports:
      - "8092:8092"
    environment:
      HTTP_ADDR: ":8092"
      GRPC_ADDR: ":9092"
      LEDGER_BASE_URL: "http://host.docker.internal:8091"
      # Leave DATABASE_URL empty for in-memory dev mode
      REDIS_URL: redis://redis:6379
      CORS_ALLOWED_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
