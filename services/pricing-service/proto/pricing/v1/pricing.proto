syntax = "proto3";

package pricing.v1;

option go_package = "github.com/nexora/pricing-service/proto/pricing/v1;pricingv1";

// PricingService gRPC surface (stub — HTTP is primary in memory mode).
service PricingService {
  rpc UpsertPrice(UpsertPriceRequest) returns (PriceEntry);
  rpc GetPrice(GetPriceRequest) returns (GetPriceResponse);
  rpc QuoteCart(QuoteCartRequest) returns (Quote);
  rpc SimulateQuote(QuoteCartRequest) returns (Quote);
  rpc TaxCalculate(TaxCalculateRequest) returns (TaxCalculateResponse);
  rpc ApplyDynamic(ApplyDynamicRequest) returns (ApplyDynamicResponse);
}

message UpsertPriceRequest {
  string tenant_id = 1;
  string price_book_id = 2;
  string variant_id = 3;
  string scope = 4;
  string scope_id = 5;
  int64 amount_minor = 6;
  string currency = 7;
}

message PriceEntry {
  string id = 1;
  string tenant_id = 2;
  string variant_id = 3;
  string scope = 4;
  int64 amount_minor = 5;
  string currency = 6;
}

message GetPriceRequest {
  string tenant_id = 1;
  string variant_id = 2;
  string currency = 3;
  string region_id = 4;
  string warehouse_id = 5;
  string customer_id = 6;
}

message GetPriceResponse {
  int64 amount_minor = 1;
  string currency = 2;
  string scope = 3;
  PriceEntry entry = 4;
}

message QuoteLineInput {
  string variant_id = 1;
  int32 qty = 2;
}

message QuoteCartRequest {
  string tenant_id = 1;
  string cart_id = 2;
  string currency = 3;
  string region_id = 4;
  string warehouse_id = 5;
  repeated string coupon_codes = 6;
  repeated QuoteLineInput lines = 7;
  int64 delivery_minor = 8;
  int64 tip_minor = 9;
}

message QuoteLine {
  string variant_id = 1;
  int32 qty = 2;
  int64 unit_price_minor = 3;
  int64 line_total_minor = 4;
  int64 discount_minor = 5;
}

message Quote {
  string id = 1;
  string currency = 2;
  repeated QuoteLine lines = 3;
  int64 subtotal_minor = 4;
  int64 discount_minor = 5;
  int64 tax_minor = 6;
  int64 delivery_minor = 7;
  int64 total_minor = 8;
  bool simulated = 9;
}

message TaxCalculateRequest {
  string tenant_id = 1;
  string region_id = 2;
  int64 base_minor = 3;
  string currency = 4;
}

message TaxCalculateResponse {
  int64 tax_minor = 1;
  int32 rate_bps = 2;
  string rule_code = 3;
}

message ApplyDynamicRequest {
  string tenant_id = 1;
  string variant_id = 2;
  int64 unit_minor = 3;
  string currency = 4;
}

message ApplyDynamicResponse {
  int64 unit_minor = 1;
  int64 base_unit_minor = 2;
  int64 adjustment_minor = 3;
  repeated string applied_rules = 4;
}
