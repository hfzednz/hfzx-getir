openapi: 3.0.3
info:
  title: NEXORA Pricing Service
  version: 1.0.0
  description: Price books, tax display, dynamic adjustments, quote assembly via PromoClient.Evaluate.
servers:
  - url: http://localhost:8095
paths:
  /health:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK
  /v1/pricing/books:
    post:
      summary: Upsert price book
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, currency]
              properties:
                bookId:
                  type: string
                  format: uuid
                name:
                  type: string
                currency:
                  type: string
                active:
                  type: boolean
      responses:
        "201":
          description: Created
    get:
      summary: List price books
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: OK
  /v1/pricing/prices:
    post:
      summary: Upsert scoped price entry
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priceBookId, variantId, scope, amountMinor, currency]
              properties:
                entryId:
                  type: string
                  format: uuid
                priceBookId:
                  type: string
                  format: uuid
                variantId:
                  type: string
                  format: uuid
                scope:
                  type: string
                  enum: [base, regional, warehouse, customer, vip, corporate]
                scopeId:
                  type: string
                  format: uuid
                amountMinor:
                  type: integer
                  format: int64
                currency:
                  type: string
                validFrom:
                  type: string
                  format: date-time
                validTo:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Created
    get:
      summary: Resolve waterfall price
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: variantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: currency
          in: query
          schema:
            type: string
        - name: regionId
          in: query
          schema:
            type: string
            format: uuid
        - name: warehouseId
          in: query
          schema:
            type: string
            format: uuid
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
  /v1/pricing/quote:
    post:
      summary: Assemble cart quote
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: OK
  /v1/pricing/simulate:
    post:
      summary: Simulate quote (no QuoteCreated event)
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: OK
  /v1/pricing/tax/calculate:
    post:
      summary: Calculate display tax
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseMinor]
              properties:
                regionId:
                  type: string
                  format: uuid
                baseMinor:
                  type: integer
                  format: int64
                currency:
                  type: string
      responses:
        "200":
          description: OK
  /v1/pricing/dynamic/apply:
    post:
      summary: Apply dynamic adjustments to unit price
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unitMinor]
              properties:
                variantId:
                  type: string
                  format: uuid
                unitMinor:
                  type: integer
                  format: int64
                currency:
                  type: string
                warehouseId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: OK
  /v1/pricing/admin:
    get:
      summary: Admin list books, entries, rules, audits
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: OK
components:
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    QuoteRequest:
      type: object
      required: [currency, lines]
      properties:
        cartId:
          type: string
          format: uuid
        currency:
          type: string
        regionId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        couponCodes:
          type: array
          items:
            type: string
        deliveryMinor:
          type: integer
          format: int64
        serviceMinor:
          type: integer
          format: int64
        packagingMinor:
          type: integer
          format: int64
        tipMinor:
          type: integer
          format: int64
        lines:
          type: array
          items:
            type: object
            required: [variantId, qty]
            properties:
              variantId:
                type: string
                format: uuid
              qty:
                type: integer
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            traceId:
              type: string
            retriable:
              type: boolean
