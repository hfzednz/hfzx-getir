# NEXORA warehouse-service — example configuration
# Copy to config.yaml or map keys to environment variables.

http:
  addr: ":8085"
  publicBaseUrl: "http://localhost:8085"
  corsAllowedOrigins: ["*"]
  rateLimitPerMinute: 240

grpc:
  addr: ":9095"

database:
  url: "" # empty → in-memory repositories (dev mode)

redis:
  url: "redis://localhost:6382"

kafka:
  brokers: [] # e.g. ["localhost:9096"]

inventory:
  serviceUrl: "" # e.g. "http://localhost:8083"

packing:
  weightToleranceG: 50

# Environment variable mapping (preferred in containers):
# HTTP_ADDR, GRPC_ADDR, PUBLIC_BASE_URL, DATABASE_URL, REDIS_URL,
# KAFKA_BROKERS, INVENTORY_SERVICE_URL, CORS_ALLOWED_ORIGINS,
# RATE_LIMIT_PER_MINUTE, WEIGHT_TOLERANCE_G
