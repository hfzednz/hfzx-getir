openapi: 3.0.3
info:
  title: NEXORA Open Platform
  version: 1.0.0
servers:
  - url: http://localhost:8120
paths:
  /health:
    get:
      responses: { "200": { description: ok } }
  /v1/open/bootstrap/catalog:
    post:
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses: { "200": { description: seeded } }
  /v1/open/catalog:
    get:
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: surface
          in: query
          schema: { type: string, enum: [public, private, partner] }
      responses: { "200": { description: catalog } }
  /v1/open/webhooks:
    post:
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses: { "201": { description: registered } }
  /v1/open/gateway/policies/export:
    get:
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses: { "200": { description: envoy-ready policies } }
  /v1/open/admin/stats:
    get:
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses: { "200": { description: stats } }
