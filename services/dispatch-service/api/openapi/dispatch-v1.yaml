openapi: 3.0.3
info:
  title: NEXORA Dispatch Service
  version: 1.0.0
servers:
  - url: http://localhost:8096
paths:
  /v1/dispatch/health:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK
  /v1/dispatch/jobs:
    get:
      summary: Admin list jobs
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Job page
    post:
      summary: Create dispatch
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDispatch"
      responses:
        "201":
          description: Created
  /v1/dispatch/jobs/{id}:
    get:
      summary: Get dispatch
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Dispatch
  /v1/dispatch/jobs/{id}/auto-assign:
    post:
      summary: Auto-assign nearest courier
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Assigned
  /v1/dispatch/jobs/{id}/assign:
    post:
      summary: Manual assign
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courierPrincipalId]
              properties:
                courierPrincipalId: { type: string, format: uuid }
      responses:
        "200":
          description: Assigned
  /v1/dispatch/jobs/{id}/reassign:
    post:
      summary: Reassign courier
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courierPrincipalId]
              properties:
                courierPrincipalId: { type: string, format: uuid }
      responses:
        "200":
          description: Reassigned
  /v1/dispatch/jobs/{id}/pickup/start:
    post:
      summary: Start pickup
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Updated
  /v1/dispatch/jobs/{id}/pickup/complete:
    post:
      summary: Complete pickup
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Updated
  /v1/dispatch/jobs/{id}/transit/start:
    post:
      summary: Start transit
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Updated
  /v1/dispatch/jobs/{id}/arrive:
    post:
      summary: Mark arrived
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Updated
  /v1/dispatch/jobs/{id}/complete:
    post:
      summary: Complete with POD
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [podType, podReference]
              properties:
                podType: { type: string, enum: [otp, qr, photo, signature, gps] }
                podReference: { type: string }
      responses:
        "200":
          description: Delivered
  /v1/dispatch/jobs/{id}/fail:
    post:
      summary: Fail delivery
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                note: { type: string }
                requeue: { type: boolean }
      responses:
        "200":
          description: Failed
  /v1/dispatch/batches:
    post:
      summary: Batch create
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "201":
          description: Created
  /v1/dispatch/fleet/vehicles:
    get:
      summary: List vehicles
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Vehicles
    post:
      summary: Upsert vehicle
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Upserted
  /v1/dispatch/couriers/snapshot:
    post:
      summary: Upsert courier snapshot
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Upserted
  /v1/dispatch/outbox/publish:
    post:
      summary: Drain outbox
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Published count
components:
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Point:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }
    CreateDispatch:
      type: object
      required: [orderId, pickup, dropoff]
      properties:
        orderId: { type: string, format: uuid }
        fulfillmentId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        pickup: { $ref: "#/components/schemas/Point" }
        dropoff: { $ref: "#/components/schemas/Point" }
        requiredVehicle: { type: string, enum: [bike, scooter, car, van] }
        city: { type: string }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            traceId: { type: string }
            retriable: { type: boolean }
