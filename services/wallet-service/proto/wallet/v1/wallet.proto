syntax = "proto3";

package nexora.wallet.v1;

option go_package = "github.com/nexora/wallet-service/proto/wallet/v1;walletv1";

service WalletService {
  rpc GetOrCreate(GetOrCreateRequest) returns (WalletView);
  rpc GetWallet(GetWalletRequest) returns (WalletView);
  rpc Credit(MoneyRequest) returns (MoneyResponse);
  rpc Debit(MoneyRequest) returns (MoneyResponse);
  rpc Hold(HoldRequest) returns (HoldResponse);
  rpc Release(ReleaseRequest) returns (HoldResponse);
  rpc Transfer(TransferRequest) returns (Transfer);
  rpc History(HistoryRequest) returns (HistoryResponse);
  rpc AdminAdjust(AdminAdjustRequest) returns (MoneyResponse);
}

message GetOrCreateRequest {
  string tenant_id = 1;
  string principal_id = 2;
  string currency = 3;
}

message GetWalletRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message MoneyRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string account_type = 3;
  int64 amount_minor = 4;
  string idempotency_key = 5;
  string reference = 6;
}

message HoldRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string account_type = 3;
  int64 amount_minor = 4;
  string idempotency_key = 5;
  string reference = 6;
}

message ReleaseRequest {
  string tenant_id = 1;
  string hold_id = 2;
}

message TransferRequest {
  string tenant_id = 1;
  string from_wallet_id = 2;
  string from_account_type = 3;
  string to_wallet_id = 4;
  string to_account_type = 5;
  int64 amount_minor = 6;
  string idempotency_key = 7;
}

message HistoryRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message AdminAdjustRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string account_type = 3;
  int64 amount_minor = 4;
  string idempotency_key = 5;
  string reason = 6;
}

message Account {
  string id = 1;
  string account_type = 2;
  int64 balance_minor = 3;
  int64 held_minor = 4;
  int64 available_minor = 5;
  string currency = 6;
}

message WalletView {
  string id = 1;
  string tenant_id = 2;
  string principal_id = 3;
  string currency = 4;
  repeated Account accounts = 5;
}

message MoneyResponse {
  Account account = 1;
  string entry_id = 2;
}

message HoldResponse {
  string hold_id = 1;
  string status = 2;
  int64 available_minor = 3;
  int64 held_minor = 4;
}

message Transfer {
  string id = 1;
  int64 amount_minor = 2;
  string currency = 3;
}

message HistoryResponse {
  repeated string entry_ids = 1;
  int32 total = 2;
}
