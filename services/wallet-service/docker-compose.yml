services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
      POSTGRES_DB: wallet
    ports:
      - "5441:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 5

  wallet-service:
    build: .
    ports:
      - "8090:8090"
    environment:
      HTTP_ADDR: ":8090"
      GRPC_ADDR: ":9100"
      CORS_ALLOWED_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
