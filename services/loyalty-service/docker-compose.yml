services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
      POSTGRES_DB: loyalty
    ports:
      - "5444:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d loyalty"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6383:6379"

  loyalty-service:
    build: .
    ports:
      - "8093:8093"
    environment:
      HTTP_ADDR: ":8093"
      GRPC_ADDR: ":9103"
      CORS_ALLOWED_ORIGINS: "*"
      WALLET_BASE_URL: "http://host.docker.internal:8090"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
