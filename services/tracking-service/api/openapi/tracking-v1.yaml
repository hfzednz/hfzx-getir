openapi: 3.0.3
info:
  title: NEXORA Tracking Service
  version: 1.0.0
  description: Live courier locations, delivery timelines, arrival detection.
servers:
  - url: http://localhost:8098
paths:
  /health:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK
  /v1/tracking/locations:
    post:
      summary: Ingest courier GPS location
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courierId, lat, lon]
              properties:
                courierId:
                  type: string
                  format: uuid
                lat:
                  type: number
                lon:
                  type: number
                accuracyM:
                  type: number
                headingDeg:
                  type: number
                speedMps:
                  type: number
                orderId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Created
  /v1/tracking/couriers/{id}/live:
    get:
      summary: Get live courier location
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
  /v1/tracking/orders/{orderId}/timeline:
    get:
      summary: Get order delivery timeline
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
    post:
      summary: Append timeline event
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                message:
                  type: string
                courierId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Created
  /v1/tracking/arrival/detect:
    post:
      summary: Detect arrival by distance threshold
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courierId, orderId, dropoffLat, dropoffLon]
              properties:
                courierId:
                  type: string
                  format: uuid
                orderId:
                  type: string
                  format: uuid
                dropoffLat:
                  type: number
                dropoffLon:
                  type: number
                thresholdM:
                  type: number
      responses:
        "200":
          description: OK
  /v1/tracking/nearby:
    get:
      summary: List nearby couriers
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lon
          in: query
          required: true
          schema:
            type: number
        - name: radiusM
          in: query
          schema:
            type: number
      responses:
        "200":
          description: OK
components:
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
