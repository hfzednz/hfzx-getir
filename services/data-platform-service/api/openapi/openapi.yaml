openapi: 3.0.3
info:
  title: NEXORA Data Platform
  version: 1.0.0
servers:
  - url: http://localhost:8107
paths:
  /v1/data/events:
    post:
      summary: Ingest analytics event
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: Created }
  /v1/data/schemas:
    post:
      summary: Register event schema
      responses:
        "201": { description: Created }
  /v1/data/warehouse/refresh:
    post:
      summary: Refresh KPI marts
      responses:
        "200": { description: OK }
  /v1/data/realtime:
    get:
      summary: Live metrics
      responses:
        "200": { description: OK }
  /v1/data/admin/stats:
    get:
      summary: Admin counters
      responses:
        "200": { description: OK }
