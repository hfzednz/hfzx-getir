name: ci-web-quality

on:
  push:
    branches: [main, master]
    paths:
      - "apps/**-web/**"
      - "apps/admin_web/**"
      - "apps/super_admin_web/**"
      - "packages/web/**"
      - "scripts/ci/web-static.sh"
      - ".github/workflows/ci-web-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-static:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Build web applications
        run: bash scripts/ci/web-static.sh

  customer-web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: web-static
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: chmod scripts
        run: chmod +x scripts/ci/*.sh
      - name: Customer web smoke (build + start + curl)
        run: |
          set -euo pipefail
          cd packages/web/core && npm install --no-fund --no-audit
          cd ../../web/ui && npm install --no-fund --no-audit
          cd ../../../apps/customer-web
          npm ci --no-fund --no-audit 2>/dev/null || npm install --no-fund --no-audit
          npm run build
          npm run start -- -p 3000 &
          pid=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/login >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/login | grep -qi nexora
          kill $pid
          echo "CUSTOMER_WEB_SMOKE_PASS"
