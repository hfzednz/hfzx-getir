name: ci-web-quality

on:
  push:
    branches: [main, master]
    paths:
      - "apps/**-web/**"
      - "apps/admin_web/**"
      - "apps/super_admin_web/**"
      - "packages/web/**"
      - "scripts/ci/web-static.sh"
      - ".github/workflows/ci-web-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-static:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Build web applications
        run: bash scripts/ci/web-static.sh

  customer-web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: web-static
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: chmod scripts
        run: chmod +x scripts/ci/*.sh scripts/staging/*.sh
      - name: Web E2E (Docker stack + Playwright)
        run: bash scripts/ci/web-e2e.sh
