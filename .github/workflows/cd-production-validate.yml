name: cd-production-validate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: staging|prod|qa|demo|dr
        required: true
        default: staging
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Integration cert
        run: go run ./tools/integration-cert
        continue-on-error: false
      - name: Prod validate
        env:
          PROD_VALIDATE_ENV: ${{ inputs.environment }}
          PROD_VALIDATE_BASE_URL: ${{ vars.NEXORA_BASE_URL }}
        run: go run ./tools/prod-validate -env=${{ inputs.environment }}
