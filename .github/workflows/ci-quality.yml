name: ci-quality

on:
  pull_request:
    paths:
      - "services/**"
      - "qa/**"
      - "tools/integration-cert/**"
      - ".github/workflows/ci-quality.yml"
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # nightly

jobs:
  quality-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Quality service tests
        working-directory: services/quality-service
        run: go test ./...
      - name: Integration cert tool
        working-directory: tools/integration-cert
        run: go test ./... || go build -o /dev/null .

  quality-gates:
    runs-on: ubuntu-latest
    needs: quality-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Lint k6 scripts present
        run: test -f qa/k6/checkout_load.js && test -f qa/strategy/TEST_STRATEGY.md
      - name: Chaos manifests present
        run: test -f qa/chaos/kafka.yaml && test -f qa/zap/baseline.yaml
      - name: Playwright config present
        run: test -f qa/playwright/playwright.config.ts

  nightly-perf-security:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: k6 script syntax note
        run: echo "Run k6 against staging with secrets; upload JUnit/Allure to quality-service ingest"
      - name: ZAP baseline note
        run: echo "Run zap-baseline.py per qa/zap/baseline.yaml on staging edge"
