global:
  imageRegistry: ghcr.io/nexora
  imagePullPolicy: IfNotPresent
  environment: staging
  mesh:
    enabled: true
    inject: true

serviceAccount:
  create: true
  name: nexora

deployments:
  strategy: RollingUpdate
  canary:
    enabled: false
    weight: 10

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  cpuAverage: 70

pdb:
  enabled: true
  minAvailable: 1

services:
  platform-ops-service:
    enabled: true
    replicaCount: 2
    image:
      repository: platform-ops-service
      tag: "1.0.0"
    ports:
      http: 8110
      grpc: 9110
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
  bff-customer:
    enabled: true
    replicaCount: 3
    image: { repository: bff-customer, tag: "1.0.0" }
    ports: { http: 8111 }
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
  bff-courier:
