# Kafka retention / producer / consumer hardening
topics:
  default_retention_ms: 604800000 # 7d
  high_volume_retention_ms: 172800000 # 2d for tracking/notification
producer:
  acks: all
  enable_idempotence: true
  compression_type: zstd
  linger_ms: 5
  batch_size: 65536
consumer:
  max_poll_records: 500
  fetch_min_bytes: 1024
  session_timeout_ms: 45000
broker:
  num_network_threads: 8
  num_io_threads: 16
  log_segment_bytes: 1073741824
