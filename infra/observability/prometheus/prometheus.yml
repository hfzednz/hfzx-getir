global:
  scrape_interval: 15s
scrape_configs:
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [nexora-apps, nexora-obs, nexora-system]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
  - job_name: platform-ops
    static_configs:
      - targets: ["platform-ops-service.nexora-apps:8110"]
  - job_name: liveops
    static_configs:
      - targets: ["liveops-service.nexora-apps:8116"]
  - job_name: supplier
    static_configs:
      - targets: ["supplier-service.nexora-apps:8117"]
  - job_name: quality
    static_configs:
      - targets: ["quality-service.nexora-apps:8118"]
  - job_name: global
    static_configs:
      - targets: ["global-service.nexora-apps:8119"]
  - job_name: open-platform
    static_configs:
      - targets: ["open-platform-service.nexora-apps:8120"]
  - job_name: superapp
    static_configs:
      - targets: ["superapp-service.nexora-apps:8121"]
  - job_name: innovation
    static_configs:
      - targets: ["innovation-service.nexora-apps:8122"]
  - job_name: enterprise-ops
    static_configs:
      - targets: ["enterprise-ops-service.nexora-apps:8123"]
  - job_name: hyperscale
    static_configs:
      - targets: ["hyperscale-cert-service.nexora-apps:8124"]
  - job_name: autonomy
    static_configs:
      - targets: ["autonomy-service.nexora-apps:8125"]
  - job_name: identity
    static_configs:
      - targets: ["identity-service.nexora-apps:8081"]
  - job_name: order
    static_configs:
      - targets: ["order-service.nexora-apps:8085"]
  - job_name: payment
    static_configs:
      - targets: ["payment-service.nexora-apps:8089"]
  - job_name: bff-customer
    static_configs:
      - targets: ["bff-customer.nexora-apps:8111"]
  - job_name: bff-admin
    static_configs:
      - targets: ["bff-admin.nexora-apps:8114"]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager.nexora-obs:9093"]
rule_files:
  - /etc/prometheus/rules/*.yml
