global:
  resolve_timeout: 5m
route:
  receiver: default
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - matchers: [severity = critical]
      receiver: pager
      continue: true
    - matchers: [severity = high]
      receiver: slack-incidents
receivers:
  - name: default
    webhook_configs:
      - url: http://platform-ops-service.nexora-apps:8110/v1/ops/alerts/webhook
  - name: pager
    webhook_configs:
      - url: http://platform-ops-service.nexora-apps:8110/v1/ops/alerts/page
  - name: slack-incidents
    webhook_configs:
      - url: http://platform-ops-service.nexora-apps:8110/v1/ops/alerts/slack
inhibit_rules:
  - source_matchers: [severity = critical]
    target_matchers: [severity = high]
    equal: [alertname, service]
